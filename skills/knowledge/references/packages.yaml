# HomeMaster work packages
#
# A work package is ONE element of ONE job (for example "wc-frame" or "shower-glass"),
# small enough to be explained in a single work card and done in one session.
# Room sequences below put the packages in the order they must be done.
#
# Fields
#   name   display names per language
#   stage  A decide/plan, B strip-out, C rough-in, D substrate, E waterproofing,
#          F surfaces, G fit-out, H finish and handover, O outdoor, S specialist
#   task   the graph task (dependencies.yaml) whose preconditions apply
#   src    where the technique is written: "file#heading text" relative to this folder.
#          {room} is replaced by the room type id
#   after  packages that must be finished before this one (only enforced when present in the room)
#   who    diy | diy+pro (you plus a licensed pro for part) | pro
#   time   typical effort for one person plus a helper (a guide, not a promise)
#   opt    true when the package may not apply (the plan asks)
#   part   optional: "rough-in" or "fit" when the source section has both parts. Use only that part
#
# The order of packages for every room type is in sequences.yaml (same folder).
#
# Order rule (checked by the validation script): in every room sequence each
# package comes after all of its "after" packages that are in that sequence.

schema_version: 1

packages:

  # ---------- A. Decide and plan (shared) ----------
  survey-measure: {name: {en: "Survey and measure the room", sl: "Posnetek stanja in meritve prostora"}, stage: A, task: survey-and-permits, src: ["trades/planning.md#Principles of order"], after: [], who: diy, time: "2–4 h"}
  room-decisions: {name: {en: "Decide the room (layout, products, levels)", sl: "Odločitve za prostor (postavitev, izdelki, višine)"}, stage: A, task: survey-and-permits, src: ["rooms/{room}.md#Decide first"], after: [survey-measure], who: diy, time: "1–3 evenings"}
  order-long-lead: {name: {en: "Order long-lead items", sl: "Naročilo izdelkov z dolgim dobavnim rokom"}, stage: A, task: survey-and-permits, src: ["trades/planning.md#Budget and lead times"], after: [room-decisions], who: diy, time: "2–4 h"}
  panel-and-circuits: {name: {en: "Main panel and circuits plan", sl: "Razdelilna omara in tokokrogi"}, stage: A, task: panel-and-main-services, src: ["trades/electrical.md#Other rooms"], after: [room-decisions], who: pro, time: "electrician, 0.5–2 days", opt: true}
  heating-plan: {name: {en: "Heating plan for the room", sl: "Načrt ogrevanja prostora"}, stage: A, task: heating-distribution, src: ["trades/heating.md#Whole house"], after: [room-decisions], who: diy+pro, time: "2–4 h", opt: true}
  water-heating-plan: {name: {en: "Hot water system plan", sl: "Načrt priprave tople vode"}, stage: A, task: water-heating-plan, src: ["trades/water-heating.md#Options", "trades/water-heating.md#Sizing", "trades/water-heating.md#Planning"], after: [room-decisions], who: diy, time: "2–4 h", opt: true}
  smart-plan: {name: {en: "Smart home plan and standard", sl: "Načrt pametnega doma"}, stage: A, task: smart-home-plan, src: ["trades/smart-home.md#Choose the system", "trades/smart-home.md#Planning"], after: [room-decisions], who: diy, time: "2–4 h", opt: true}

